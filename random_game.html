<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤게임!</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a; --paper:#fffdf7; --soju:#2f7d4f;
    --shot:#e8543f; --hl:#ffe867; --berry:#e85f8a; --sky:#4a90d9;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Gaegu',sans-serif; background:var(--paper); color:var(--ink);
    overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:18px; text-align:center; overflow-y:auto;
  }
  .hidden{display:none !important;}
  button{
    font-family:'Gaegu',sans-serif; font-size:22px; font-weight:700;
    background:var(--paper); border:3px solid var(--ink);
    border-radius:255px 15px 225px 15px / 15px 225px 15px 255px;
    padding:9px 22px; cursor:pointer; transition:transform .08s;
    box-shadow:3px 3px 0 var(--ink);
  }
  button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  button:disabled{cursor:default;}
  .btn-green{background:var(--soju);color:#fff;}
  .btn-berry{background:var(--berry);color:#fff;}
  .btn-sky{background:var(--sky);color:#fff;}
  .btn-small{font-size:17px;padding:5px 14px;box-shadow:2px 2px 0 var(--ink);}
  .back-corner{position:absolute;top:12px;left:12px;z-index:20;}
  .sub{font-size:20px;color:#555;}
  .msg{font-size:24px;min-height:1.3em;font-weight:700;}
  .msg .drink{color:var(--shot);}
  .record-line{display:block;font-size:.72em;color:#777;font-weight:400;margin-top:4px;}

  /* ---------- 시작/구호 ---------- */
  #title-main{font-size:clamp(44px,9vw,84px);font-weight:700;line-height:1.05;animation:wobble 2.2s ease-in-out infinite;}
  #title-main .soju{color:var(--soju);}
  @keyframes wobble{0%,100%{transform:rotate(-1.5deg);}50%{transform:rotate(1.5deg);}}
  #name-input{font-family:'Gaegu',sans-serif;font-size:26px;text-align:center;border:none;border-bottom:3px solid var(--ink);background:transparent;width:220px;padding:6px;}
  #name-input:focus{outline:none;border-bottom-color:var(--soju);}
  #chant-text{font-size:clamp(36px,8vw,72px);font-weight:700;min-height:1.2em;}
  .chant-pop{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
  .crowd{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  /* ---------- 메인 메뉴 ---------- */
  #menu-screen h1{font-size:clamp(36px,7.5vw,60px);}
  .menu-list{display:flex;flex-direction:column;gap:16px;width:min(340px,88vw);}
  .menu-list button{width:100%;font-size:27px;padding:14px;}
  #slot-box{
    font-size:clamp(28px,6.5vw,44px);font-weight:700;min-height:1.4em;
    color:var(--berry);
  }

  /* ---------- 게임 설명 / 랭킹 ---------- */
  #explain-screen,#rank-screen{justify-content:flex-start;padding-top:60px;}
  .explain-list{display:flex;flex-direction:column;gap:10px;width:min(420px,92vw);padding-bottom:30px;}
  .explain-list button{width:100%;font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .explain-list .tg{font-size:15px;color:#777;font-weight:400;}
  #rank-table{width:min(440px,92vw);border-collapse:collapse;font-size:21px;}
  #rank-table td{border-bottom:2px dashed #ccc;padding:8px 6px;text-align:left;}
  #rank-table td:last-child{text-align:right;font-weight:700;color:var(--soju);}

  /* ---------- 두들/좌석 ---------- */
  .doodle{width:96px;height:106px;transition:transform .25s;}
  .doodle svg{width:100%;height:100%;overflow:visible;}
  .doodle path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;}
  .bounce{animation:bounce .5s ease-in-out infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
  .shake{animation:shake .3s linear infinite;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px) rotate(-3deg);}75%{transform:translateX(4px) rotate(3deg);}}
  .beat-hop{animation:hop .18s ease;}
  @keyframes hop{50%{transform:translateY(-8px);}}
  .stand .doodle{transform:translateY(-22px);}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
  /* ---------- POV 원탁 배치 (내 시점!) ---------- */
  .seat-table{position:relative;width:min(520px,94vw);height:228px;margin:0 auto;flex-shrink:0;}
  .pov-deco{  /* 원탁 테이블 + 술상 */
    position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:92%;height:96px;
    border:3px solid var(--ink);border-radius:50%;
    background:#f6efdf;
    display:flex;align-items:center;justify-content:center;gap:20px;
    font-size:24px;z-index:0;
  }
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:2;}
  .seat.pos1{left:1%;bottom:64px;}                              /* 왼쪽 콤이 */
  .seat.pos2{left:50%;top:0;transform:translateX(-50%);}        /* 맞은편(멀어서 작게) */
  .seat.pos3{right:1%;bottom:64px;}                             /* 오른쪽 콤이 */
  .seat.pos2 .doodle{width:72px;height:80px;}
  .seat.pos1 .doodle{transform:rotate(5deg);}
  .seat.pos3 .doodle{transform:rotate(-5deg);}
  .seat.me{left:50%;bottom:-14px;transform:translateX(-50%);z-index:5;}
  .seat.me .doodle{width:118px;height:130px;transition:opacity 1.1s ease, transform 1.1s ease;}
  .seat.me.faded .doodle{opacity:0;transform:scale(1.3) translateY(12px);}  /* 내 시점으로 빨려들어감 */
  .seat.me .pname{background:rgba(255,253,247,.92);border-radius:6px;padding:0 6px;}
  .seat .pname{font-size:19px;font-weight:700;}
  .seat.turn .pname{background:var(--hl);border-radius:6px;padding:0 8px;}
  @keyframes screenshake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  .screen.shaking{animation:screenshake .4s linear 2;}
  .bubble{
    position:absolute;top:-44px;left:50%;transform:translateX(-50%);
    background:#fff;border:3px solid var(--ink);
    border-radius:225px 15px 255px 15px / 15px 255px 15px 225px;
    padding:2px 12px;font-size:21px;font-weight:700;white-space:nowrap;
    opacity:0;transition:opacity .12s;z-index:5;
  }
  .bubble.show{opacity:1;}

  /* ---------- 31 ---------- */
  #game31-screen{justify-content:flex-start;padding-top:30px;}
  #count-display{font-size:clamp(56px,13vw,110px);font-weight:700;line-height:1;min-height:1.05em;}
  #count-display.danger{color:var(--shot);}
  #controls31{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}

  /* ---------- 리듬 ---------- */
  #rhythm-screen{justify-content:flex-start;padding-top:22px;gap:11px;}
  #r-title{font-size:26px;font-weight:700;}
  #r-round{font-size:clamp(38px,9vw,68px);font-weight:700;line-height:1.05;min-height:1.1em;}
  #r-round .who{font-size:.55em;color:#666;font-weight:400;}
  #beat-row{display:flex;gap:clamp(6px,2vw,14px);justify-content:center;align-items:flex-end;min-height:70px;}
  .beat-dot{
    width:clamp(30px,7vw,46px);height:clamp(30px,7vw,46px);
    border:3px solid var(--ink);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;background:#fff;
    position:relative;transition:transform .1s, background .1s;
  }
  .beat-dot .body-icon{position:absolute;bottom:-24px;font-size:15px;}
  .beat-dot.req{background:var(--hl);}
  .beat-dot.req2{background:var(--berry);color:#fff;}
  .beat-dot.now{transform:scale(1.28);border-color:var(--soju);border-width:4px;}
  .beat-dot.hit{background:var(--soju);color:#fff;}
  .beat-dot.oops{background:var(--shot);color:#fff;}
  #lyric{font-size:clamp(26px,6vw,42px);font-weight:700;min-height:1.2em;color:var(--berry);}
  #tap-btn{font-size:clamp(28px,7vw,38px);padding:14px 46px;background:var(--berry);color:#fff;}
  #tap-btn:disabled{opacity:.35;}

  /* ---------- 공용 타이머 바 ---------- */
  .timer-wrap{width:min(340px,80vw);height:16px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;}
  .timer-bar{height:100%;width:100%;background:var(--soju);}
  .timer-bar.low{background:var(--shot);}

  /* ---------- 지하철 ---------- */
  #subway-screen{justify-content:flex-start;padding-top:30px;gap:12px;}
  #sub-input{font-family:'Gaegu',sans-serif;font-size:26px;text-align:center;border:none;border-bottom:3px solid var(--ink);background:transparent;width:min(260px,70vw);padding:6px;}
  #sub-input:focus{outline:none;border-bottom-color:var(--sky);}
  #sub-used{font-size:18px;color:#777;max-width:min(520px,92vw);line-height:1.4;}
  #sub-used b{color:var(--sky);}

  /* ---------- 어목조동/호빵찐빵/공용 센터 ---------- */
  #eomok-screen,#gongsan-screen,#hoppang-screen,#shoot-screen,#generic-screen{justify-content:flex-start;padding-top:28px;gap:13px;}
  .big-center{font-size:clamp(24px,5.5vw,38px);font-weight:700;min-height:2.2em;max-width:92vw;line-height:1.35;word-break:keep-all;}
  .big-center b{color:var(--shot);}
  .chip{font-size:22px;padding:9px 18px;background:#fff;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn-row button{font-size:23px;padding:11px 20px;}
  #gx-input{font-family:'Gaegu',sans-serif;font-size:26px;text-align:center;border:none;border-bottom:3px solid var(--ink);background:transparent;width:min(260px,70vw);padding:6px;}
  #gx-input:focus{outline:none;border-bottom-color:var(--sky);}

  /* ---------- 룰 모달 ---------- */
  #rule-modal{position:absolute;inset:0;background:rgba(26,26,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:26px 20px;}
  #rule-card{
    background:var(--paper);border:4px solid var(--ink);
    border-radius:255px 25px 225px 25px / 25px 225px 25px 255px;
    max-width:480px;width:100%;padding:22px 22px 16px;
    position:relative;text-align:left;box-shadow:6px 6px 0 var(--ink);
    max-height:calc(100dvh - 52px);
    display:flex;flex-direction:column;
    overflow:visible;               /* ✕ 버튼이 잘리지 않도록! */
  }
  #rule-card h2{font-size:26px;margin-bottom:4px;text-align:center;flex-shrink:0;}
  #rule-intro{font-size:16px;color:var(--berry);text-align:center;margin-bottom:8px;font-weight:700;flex-shrink:0;}
  #rule-body{overflow-y:auto;min-height:0;}   /* 내용이 정말 길 때만 안쪽 스크롤 */
  #rule-card ul{list-style:none;font-size:17px;line-height:1.35;}
  #rule-card li{margin-bottom:3px;}
  #rule-card li::before{content:"✏️ ";}
  #rule-actions{display:flex;justify-content:center;margin-top:10px;flex-shrink:0;}
  #rule-actions button{font-size:20px;padding:8px 20px;}
  #rule-x{position:absolute;top:-14px;right:-12px;width:44px;height:44px;padding:0;font-size:24px;line-height:1;border-radius:50%;background:var(--shot);color:#fff;z-index:5;}
</style>
</head>
<body>

<!-- ① 입장 -->
<div id="start-screen" class="screen">
  <div id="title-main">술게임<br><span class="soju">랜덤게임!</span></div>
  <div class="sub">이름을 알려줘! (구호에 들어가)</div>
  <input id="name-input" maxlength="6" placeholder="예: 정현" autocomplete="off">
  <button id="start-btn" class="btn-green">입장하기</button>
</div>

<!-- ② 구호 -->
<div id="chant-screen" class="screen hidden">
  <div id="chant-text"></div>
  <div class="crowd" id="chant-crowd"></div>
</div>

<!-- ③ 메인 메뉴 -->
<div id="menu-screen" class="screen hidden">
  <h1>🍺 랜덤게임!</h1>
  <div id="slot-box">&nbsp;</div>
  <div class="menu-list">
    <button id="menu-random" class="btn-berry">🎲 랜덤게임 시작</button>
    <button id="menu-explain">📖 게임 설명</button>
    <button id="menu-rank">🏆 랭킹</button>
  </div>
  <button id="menu-pick" class="btn-small">🎯 게임 골라서 하기</button>
</div>

<!-- ④ 게임 설명 (목록) -->
<div id="explain-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <h1 style="font-size:34px;">📖 게임 설명</h1>
  <div class="sub" id="explain-sub">게임을 누르면 자세한 룰이 나와!</div>
  <div class="explain-list" id="explain-list"></div>
</div>

<!-- ⑤ 랭킹 -->
<div id="rank-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <h1 style="font-size:34px;">🏆 랭킹 (이번 세션)</h1>
  <div class="sub">새로고침하면 초기화돼! 최고 기록에 도전해봐</div>
  <table id="rank-table"></table>
</div>

<!-- ⑥ 베스킨라빈스 31 -->
<div id="game31-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🍦 베스킨라빈스 31</div>
  <div id="count-display">-</div>
  <div id="table31" class="seat-table"></div>
  <div id="msg31" class="msg"></div>
  <div id="controls31">
    <button data-n="1">1개 외치기</button>
    <button data-n="2">2개 외치기</button>
    <button data-n="3">3개 외치기</button>
  </div>
  <button id="restart31-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑦ 리듬 (딸기/과일/리버스/고래 공용) -->
<div id="rhythm-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div id="r-title"></div>
  <div id="r-round">&nbsp;</div>
  <div id="lyric">&nbsp;</div>
  <div id="beat-row"></div>
  <div style="height:14px;"></div>
  <div id="table-r" class="seat-table"></div>
  <div id="r-msg" class="msg"></div>
  <button id="tap-btn" disabled>외쳐!</button>
  <div class="btn-row">
    <button id="r-restart" class="hidden btn-green">다시 하기</button>
  </div>
</div>

<!-- ⑧ 지하철 -->
<div id="subway-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🚇 지하철 게임</div>
  <div id="sub-line-pick" class="btn-row">
    <div class="sub" style="width:100%;">지하철~ 지하철! 몇호선~ 몇호선! 노선을 골라!</div>
    <button class="btn-green" data-line="line2">서울 2호선</button>
    <button class="btn-sky" data-line="incheon1">인천 1호선</button>
  </div>
  <div id="sub-play" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;">
    <div id="sub-line-name" class="sub"></div>
    <div class="timer-wrap"><div id="bar-sub" class="timer-bar"></div></div>
    <div id="table-sub" class="seat-table"></div>
    <div id="msg-sub" class="msg"></div>
    <div>
      <input id="sub-input" placeholder="역 이름!" autocomplete="off">
      <button id="sub-say" class="btn-sky">외치기!</button>
    </div>
    <div id="sub-used"></div>
    <button id="restart-sub-btn" class="hidden btn-green">다시 하기</button>
  </div>
</div>

<!-- ⑨ 어목조동 -->
<div id="eomok-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🐟 어목조동</div>
  <div id="em-center" class="big-center">어! 목! 조! 동!</div>
  <div class="timer-wrap"><div id="bar-em" class="timer-bar"></div></div>
  <div id="table-em" class="seat-table"></div>
  <div id="msg-em" class="msg"></div>
  <div id="em-chips" class="btn-row"></div>
  <div id="em-used" class="sub" style="max-width:min(520px,92vw);"></div>
  <button id="restart-em-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑩ 공산당 (왕게임) -->
<div id="gongsan-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">✊ 공산당</div>
  <div id="gs-center" class="big-center">공~산당 공산당!</div>
  <div class="timer-wrap"><div id="bar-gs" class="timer-bar"></div></div>
  <div id="table-gs" class="seat-table"></div>
  <div id="msg-gs" class="msg"></div>
  <div id="gs-targets" class="btn-row"></div>
  <button id="restart-gs-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑪ 호빵찐빵 (007빵식) -->
<div id="hoppang-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🥟 호빵찐빵</div>
  <div id="hp-center" class="big-center">호! 빵~ 찐~빵 대빵!</div>
  <div class="timer-wrap"><div id="bar-hp" class="timer-bar"></div></div>
  <div id="table-hp" class="seat-table"></div>
  <div id="msg-hp" class="msg"></div>
  <div id="hp-controls" class="btn-row">
    <button data-syl="호">호!</button>
    <button data-syl="빵">빵!</button>
    <button data-syl="찐">찐!</button>
    <button data-syl="대">대!</button>
    <button data-syl="으악" class="btn-berry">😱 으악!</button>
  </div>
  <button id="restart-hp-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑫ 슛돌이 (눈치 기립) -->
<div id="shoot-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">⚽ 슛돌이</div>
  <div id="st-center" class="big-center">🎵 날아라~ 슛돌이~</div>
  <div class="timer-wrap"><div id="bar-st" class="timer-bar"></div></div>
  <div id="table-st" class="seat-table"></div>
  <div id="msg-st" class="msg"></div>
  <button id="st-stand" class="btn-berry" style="font-size:26px;padding:12px 36px;">🙋 일어나기!</button>
  <button id="restart-st-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑬ 범용 게임 화면 (11~30번 게임 공용) -->
<div id="generic-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div id="gx-title" style="font-size:28px;font-weight:700;"></div>
  <div id="gx-center" class="big-center"></div>
  <div class="timer-wrap"><div id="bar-gx" class="timer-bar"></div></div>
  <div id="table-gx" class="seat-table"></div>
  <div id="msg-gx" class="msg"></div>
  <div id="gx-controls" class="btn-row"></div>
  <div id="gx-input-row" class="hidden">
    <input id="gx-input" placeholder="입력!" autocomplete="off">
    <button id="gx-say" class="btn-sky">외치기!</button>
  </div>
  <button id="restart-gx-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- 룰 모달 -->
<div id="rule-modal" class="hidden">
  <div id="rule-card">
    <button id="rule-x" aria-label="닫기">✕</button>

<script>
/* ================= 공통 ================= */
const $ = id => document.getElementById(id);
let playerName = "○○";
const NPC_NAMES = ["취한 콤이", "안 취한 콤이", "만취 콤이"];
function rndOf(a){ return a[Math.floor(Math.random()*a.length)]; }
function doodleSVG(){
  return `<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
    <path d="M45 28 Q42 12 60 8 Q80 5 86 18 Q90 30 78 36 Q62 42 50 36 Q45 33 45 28 Z"/>
    <path d="M46 42 Q30 50 26 72 Q22 92 32 96 Q38 98 42 92 Q40 104 48 112 Q54 118 58 110 Q60 104 59 96 Q62 104 66 112 Q72 120 78 112 Q82 105 78 94 Q84 100 90 94 Q98 86 92 66 Q86 48 72 42 Q58 37 46 42 Z"/>
  </svg>`;
}
function buildSeats(containerId){
  const names = [playerName, ...NPC_NAMES];
  const table = $(containerId);
  /* 원탁 + 술상 데코 (내 시점 테이블!) */
  table.innerHTML = `<div class="pov-deco"><span>🍶</span><span>🥃</span><span>🍺</span><span>🥃</span><span>🍶</span></div>`;
  return names.map((name, idx) => {
    const seat = document.createElement("div");
    seat.className = `seat pos${idx}` + (idx===0 ? " me" : "");
    seat.innerHTML = `<div class="bubble"></div><div class="doodle">${doodleSVG()}</div>
      <div class="pname">${name}${idx===0?" (나)":""}</div>`;
    table.appendChild(seat);
    /* 게임에 들어가면 "나"는 페이드아웃 → 1인칭 시점 전환! (이름표는 남음) */
    if(idx === 0) setTimeout(() => { if(seat.isConnected) seat.classList.add("faded"); }, 900);
    return { name, isHuman: idx===0, el: seat,
      bubble: seat.querySelector(".bubble"), doodle: seat.querySelector(".doodle") };
  });
}
/* 걸렸을 때: 내 캐릭터라면 다시 페이드인 되면서 부들부들 + 화면 흔들림 */
function shakeSeat(p){
  p.el.classList.remove("faded");
  p.doodle.classList.remove("shake"); void p.doodle.offsetWidth; p.doodle.classList.add("shake");
  if(p.isHuman){
    const sc = p.el.closest(".screen");
    if(sc){ sc.classList.remove("shaking"); void sc.offsetWidth; sc.classList.add("shaking"); }
  }
}
function bubbleSay(p, text, ms=900){
  p.bubble.textContent = text; p.bubble.classList.add("show");
  clearTimeout(p._bt); p._bt = setTimeout(() => p.bubble.classList.remove("show"), ms);
}
function hop(p){ p.doodle.classList.remove("beat-hop"); void p.doodle.offsetWidth; p.doodle.classList.add("beat-hop"); }
const SCREENS = ["start-screen","chant-screen","menu-screen","explain-screen","rank-screen",
  "game31-screen","rhythm-screen","subway-screen","eomok-screen","gongsan-screen","hoppang-screen","shoot-screen","generic-screen"];
function showScreen(id){ SCREENS.forEach(s => $(s).classList.toggle("hidden", s !== id)); }
function stopAll(){ stopRhythm(); stopSubway(); stopEomok(); stopGongsan(); stopHoppang(); stopShoot(); stopGeneric(); }

/* ---- 오디오 ---- */
let AC = null;
function audio(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function click(type){
  try{
    const ctx = audio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    const conf = { knee:[150,'sine',.09], clap:[650,'triangle',.06],
      thumb:[980,'triangle',.05], word:[1300,'square',.05], fail:[90,'sawtooth',.35] }[type];
    o.frequency.value = conf[0]; o.type = conf[1];
    g.gain.setValueAtTime(type==='word'?0.12:0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + conf[2]);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + conf[2]);
  }catch(e){}
}

/* ---- 랭킹 (세션 메모리) ---- */
const REC = {};   // { key: { val, label } }
function saveRec(key, val, labelFn){
  if(!REC[key] || val > REC[key].val) REC[key] = { val, label: labelFn(val) };
}

/* ================= ① 입장 → ② 구호 → ③ 메뉴 ================= */
$("start-btn").addEventListener("click", enter);
$("name-input").addEventListener("keydown", e => { if(e.key==="Enter") enter(); });
function enter(){
  audio();
  playerName = $("name-input").value.trim() || "아무개";
  showScreen("chant-screen");
  const crowd = $("chant-crowd"); crowd.innerHTML = "";
  for(let i=0;i<4;i++){
    const d = document.createElement("div");
    d.className = "doodle bounce"; d.style.animationDelay = (i*0.12)+"s";
    d.innerHTML = doodleSVG(); crowd.appendChild(d);
  }
  const lines = [`${playerName}이(가)~`, `좋아하는~`, `랜덤게임!`, `랜덤게임! 🎉`];
  const el = $("chant-text"); let i = 0;
  (function next(){
    if(i < lines.length){
      el.textContent = lines[i++];
      el.classList.remove("chant-pop"); void el.offsetWidth; el.classList.add("chant-pop");
      click(i%2 ? 'clap':'thumb');
      setTimeout(next, 800);
    } else setTimeout(() => showScreen("menu-screen"), 500);
  })();
}
document.querySelectorAll("[data-menu]").forEach(b => b.addEventListener("click", () => {

}));

/* ================= 베스킨라빈스 31 ================= */
let seats31 = [], cur31 = 0, turn31 = 0, over31 = false, wins31 = 0;
function start31(){
  showScreen("game31-screen");
  seats31 = buildSeats("table31");
  reset31(); loop31();
}
function reset31(){
  cur31 = 0; turn31 = 0; over31 = false;
  $("count-display").textContent = "시~작!";
  $("count-display").classList.remove("danger");
  $("msg31").textContent = "";
  $("restart31-btn").classList.add("hidden");
  ctrl31(false);
  seats31.forEach(p => p.doodle.classList.remove("shake"));
  if(seats31[0]) seats31[0].el.classList.add("faded");   // 다시 내 시점으로!
}
function loop31(){
  seats31.forEach((p,i) => p.el.classList.toggle("turn", i===turn31));
  if(seats31[turn31].isHuman){
    $("msg31").textContent = "네 차례! 몇 개 외칠래?";
    ctrl31(true);
  } else {
    ctrl31(false);
    $("msg31").textContent = `${seats31[turn31].name} 생각 중...`;
    setTimeout(() => { if(!over31 && seats31.length) npc31(); }, 900 + Math.random()*700);
  }
}
function ctrl31(on){
  document.querySelectorAll("#controls31 button").forEach(b => {
    const n = +b.dataset.n;
    b.disabled = !on || (cur31 + n > 31);
    b.style.opacity = b.disabled ? .4 : 1;
  });
}
document.querySelectorAll("#controls31 button").forEach(b => {
  b.addEventListener("click", () => {
    if(over31 || !seats31[turn31].isHuman) return;
    say31(+b.dataset.n);
  });
});
function npc31(){
  let opts = [1,2,3].filter(n => cur31 + n <= 31);
  const safe = opts.filter(n => cur31 + n !== 31);
  let pick;
  if(safe.length){
    const smart = safe.find(n => (cur31 + n) % 4 === 2);
    pick = (smart && Math.random() < 0.3) ? smart : rndOf(safe);
  } else pick = opts[0];
  say31(pick);
}
function say31(n){
  const p = seats31[turn31];
  const nums = []; for(let i=1;i<=n;i++) nums.push(cur31+i);
  cur31 += n;
  bubbleSay(p, nums.join(", ") + "!", 1100);
  click('word');
  const cd = $("count-display");
  cd.textContent = cur31;
  cd.classList.toggle("danger", cur31 >= 27);
  if(cur31 >= 31){ lose31(p); return; }
  turn31 = (turn31 + 1) % seats31.length;
  setTimeout(() => { if(!over31) loop31(); }, 700);
}
function lose31(p){
  over31 = true; ctrl31(false); click('fail');
  shakeSeat(p);
  if(!p.isHuman){ wins31++; saveRec("g31", wins31, gamesByKey.g31.recLabel); }
  $("msg31").innerHTML = p.isHuman
    ? `앗, <b class="drink">${p.name}</b> 당첨! 마셔~ 마셔~ 🍺`
    : `<b class="drink">${p.name}</b> 당첨! 원샷~ 🍺 <span class="record-line">이번 세션 ${wins31}승!</span>`;
  $("restart31-btn").classList.remove("hidden");
}
$("restart31-btn").addEventListener("click", () => { reset31(); loop31(); });

const FRUITS = ["딸기","당근","수박","참외","메론"];
const FRUITS_FLIP = ["기딸","근당","박수","외참","론메"];   // 글자 뒤집기 리버스!

const RGAMES = {

    word: i => "딸기", pat: patStd,
    intro:["딸기가","좋아~","딸기가","좋아~","좋아!","좋아!","좋아좋아","좋아~!",

           "론메!","·","리버스~!","·","가보자~","·","·","·"] },
  whale:   { title:"🐋 고래 게임", bpm:92, tap:"고래!",
    word: i => "고래", pat: patWhale,
    intro:["고오래~","고래","고래","으쌰","으쌰","으쌰","으쌰","·",
           "고오래~","고래","고래","으쌰","으쌰","으쌰","으쌰","·"] }
};
/* 1~4개: 4박자에서 ④박부터 역순 / 5~8개: 8박자 확장(앞4박 꽉 + ⑧박부터 역순) */
function patStd(n){
  if(n <= 4){ const a = Array(4).fill(0); for(let b=4-n;b<4;b++) a[b]=1; return a; }
  const a = Array(8).fill(0);
  for(let b=0;b<4;b++) a[b]=1;
  for(let b=8-(n-4);b<8;b++) a[b]=1;
  return a;
}
/* 고래: 5개부터 8박자 + 한 박에 "고래고래" 2개씩 (⑧박부터 뒤에서 역순 배치) */
function patWhale(n){
  if(n <= 4){ const a = Array(4).fill(0); for(let b=4-n;b<4;b++) a[b]=1; return a; }
  const a = Array(8).fill(0);
  const pairs = Math.floor(n/2), odd = n%2;
  let b = 8;
  for(let k=0;k<pairs;k++){ a[--b] = 2; }
  if(odd) a[--b] = 1;
  return a;
}
function nSeq(k){ const i = k % 14; return i < 8 ? i+1 : 15-i; }   // 1→8→1 왕복

let R = null;
function startRhythm(gameKey){
  showScreen("rhythm-screen");
  const cfg = RGAMES[gameKey];
  $("r-title").textContent = cfg.title;
  $("tap-btn").textContent = cfg.tap;
  $("r-restart").classList.add("hidden");
  $("r-msg").textContent = "";
  R = { key: gameKey, cfg,
    baseIv: 60000 / cfg.bpm, iv: 60000 / cfg.bpm, speed: 1,
    seats: buildSeats("table-r"), startSeat: 0,
    gb: -4, nextT: 0, countIn: 4,
    introBeats: 16, turnIdx: -1, turnStartGb: 16, curBeats: 4,
    events: [], failed: false, raf: 0 };
  buildBeatRow(8);
  $("r-round").innerHTML = "준비~ 🥁";
  $("lyric").innerHTML = "&nbsp;";
  $("tap-btn").disabled = false;
  R.nextT = performance.now() + 600;
  R.raf = requestAnimationFrame(rLoop);
}
function stopRhythm(){ if(R){ cancelAnimationFrame(R.raf); R = null; } }
function buildBeatRow(beats){
  const row = $("beat-row"); row.innerHTML = "";
  for(let b=0;b<beats;b++){
    const d = document.createElement("div");
    d.className = "beat-dot";
    d.innerHTML = `${b+1}<span class="body-icon">${BODY[b%4]}</span>`;
    row.appendChild(d);
  }
}
function rLoop(now){
  if(!R) return;
  while(!R.failed && now >= R.nextT){
    const st = R.nextT;
    fireBeat(R.gb, st);
    if(!R || R.failed) return;
    R.gb++;
    R.nextT = st + R.iv;
  }
  if(!R.failed && R.curTurn && R.curTurn.isHuman){
    for(const ev of R.events){
      if(!ev.done && !ev.missed && now > ev.t + R.iv*0.55){
        ev.missed = true; markDot(ev.beat, "oops");
        return failRhythm(R.seats[0], "박자를 놓쳤어!");
      }
    }
  }
  R.raf = requestAnimationFrame(rLoop);
}
function fireBeat(gb, st){
  if(gb < 0){
    click(gb % 2 === 0 ? 'knee' : 'clap');
    $("lyric").textContent = ["쿵","짝","따","따"][(gb + R.countIn) % 4] || "";
    return;
  }
  /* 인트로 */
  if(gb < R.introBeats){
    const local = gb % 8;
    click(local % 4 === 0 ? 'knee' : local % 4 === 1 ? 'clap' : 'thumb');
    pulseDot(local);
    $("r-round").innerHTML = "다 같이~ 🎵";
    $("lyric").textContent = R.cfg.intro[gb] === "·" ? "" : R.cfg.intro[gb];
    R.seats.forEach(hop);
    return;
  }
  /* 턴: 가변 길이 (4 또는 8박자) */
  if(gb >= R.turnStartGb + R.curBeats || R.turnIdx < 0){
    setupTurn(R.turnIdx + 1, st, gb);
  }
  const local = gb - R.turnStartGb;
  click(local % 4 === 0 ? 'knee' : local % 4 === 1 ? 'clap' : 'thumb');
  pulseDot(local);
  const evs = R.events.filter(e => e.beat === local);
  if(R.curTurn && !R.curTurn.isHuman){
    for(const ev of evs){
      bubbleSay(R.curTurn, ev.words.join(""), R.iv*0.9);
      click('word'); if(ev.need===2) setTimeout(()=>click('word'), R.iv*0.28);
      markDot(ev.beat, "hit");
      ev.done = true;
    }
    if(evs.length) hop(R.curTurn);
  }
}
function setupTurn(turnIdx, st, gb){
  R.turnIdx = turnIdx;
  R.turnStartGb = gb;
  R.speed = Math.min(2.0, 1 + 0.06 * turnIdx);   // 턴당 6% 가속, 최대 2배
  R.iv = R.baseIv / R.speed;
  const n = nSeq(turnIdx);
  const pat = R.cfg.pat(n);
  if(pat.length !== R.curBeats){ R.curBeats = pat.length; buildBeatRow(R.curBeats); }
  const seatIdx = (R.startSeat + turnIdx) % R.seats.length;
  R.curTurn = R.seats[seatIdx];
  R.seats.forEach((s,i) => s.el.classList.toggle("turn", i === seatIdx));
  let wi = 0;
  R.events = [];
  pat.forEach((need, b) => {
    if(need > 0){
      const words = [];
      for(let c=0;c<need;c++) words.push(R.cfg.word(wi++));
      R.events.push({ beat:b, need, got:0, words, done:false, missed:false, t: st + b * R.iv });
    }
  });
  const spd = R.speed > 1.02 ? ` <span class="who">⚡x${R.speed.toFixed(2)}</span>` : "";
  $("r-round").innerHTML = `${n}개!${spd} <span class="who">— ${R.curTurn.name}${R.curTurn.isHuman?" (너!)":""}</span>`;
  $("lyric").innerHTML = "&nbsp;";
  document.querySelectorAll(".beat-dot").forEach((d,b) => {
    d.classList.remove("req","req2","hit","oops");
    const ev = R.events.find(e => e.beat === b);
    if(ev) d.classList.add(ev.need === 2 ? "req2" : "req");
  });
}
function pulseDot(local){
  document.querySelectorAll(".beat-dot").forEach((d,b) => d.classList.toggle("now", b === local));
}
function markDot(beat, cls){
  const d = document.querySelectorAll(".beat-dot")[beat];
  if(d) d.classList.add(cls);
}
function playerTap(){
  if(!R || R.failed) return;
  if(!R.curTurn) return;
  if(!R.curTurn.isHuman){
    click('fail');
    bubbleSay(R.seats[0], "앗...!", 1500);
    return failRhythm(R.seats[0], "",
      `남의 차례에 손이 나갔다! <b class="drink">병x샷 병x샷 병x샷은 두잔~</b> 🍺🍺`);
  }
  const now = performance.now();
  let best = null, bestDist = Infinity;
  for(const ev of R.events){
    if(ev.done || ev.missed) continue;
    const d = Math.abs(now - ev.t);
    if(d < bestDist){ bestDist = d; best = ev; }
  }
  if(!best || bestDist > R.iv * 0.5){
    click('fail');
    return failRhythm(R.seats[0], "박자에 없는 외침! 🫢");
  }
  best.got++;
  const word = best.words[Math.min(best.got, best.words.length) - 1];
  bubbleSay(R.seats[0], best.words.slice(0, best.got).join(""), R.iv*0.9);
  click('word');
  $("lyric").textContent = word;
  hop(R.seats[0]);
  if(best.got >= best.need){ best.done = true; markDot(best.beat, "hit"); }
}
$("tap-btn").addEventListener("pointerdown", e => { e.preventDefault(); playerTap(); });
document.addEventListener("keydown", e => {
  if((e.code === "Space" || e.code === "Enter") && R && !$("rhythm-screen").classList.contains("hidden")){
    e.preventDefault(); playerTap();
  }
});
function failRhythm(p, why, customHtml){
  if(!R || R.failed) return;
  R.failed = true;
  cancelAnimationFrame(R.raf);
  click('fail');
  shakeSeat(p);
  $("tap-btn").disabled = true;
  const surv = Math.max(0, R.turnIdx);
  saveRec(R.key, surv, gamesByKey[R.key].recLabel);
  const rec = `<span class="record-line">이번 판: ${surv}턴 생존 · 최고 ⚡x${R.speed.toFixed(2)} · 최고 기록 ${REC[R.key].label}</span>`;
  $("r-msg").innerHTML = (customHtml ? customHtml
    : `${why} <b class="drink">${p.name}</b> 마셔~ 마셔~ 🍺`) + rec;
  $("r-restart").classList.remove("hidden");
}

function stopEomok(){ if(EM){ cancelAnimationFrame(EM.raf); clearTimeout(EM.timer); EM = null; } }
function emRemain(cat){
  const r = EOMOK_BANK[cat].words.filter(w => !EM.used.has(w));

}
function nextEomok(){
  if(!EM || EM.over) return;
  EM.round++;
  const caller = EM.holder;
  const cat = rndOf(["어","목","조","동"]);
  let target = rndOf([0,1,2,3].filter(i => i !== caller));

  EM.seats.forEach((p,i) => p.el.classList.toggle("turn", i === caller));
  const B = EOMOK_BANK[cat];

    $("msg-em").textContent = "...";
    EM.timer = setTimeout(() => {
      if(!EM || EM.over) return;
      const w = rndOf(emRemain(cat));

  if(!GS || GS.over) return;

      GS.timer = setTimeout(nextGongsan, 900);

      bubbleSay(T, "알갔습네다!", 1000);

      GS.holder = target;

}

function hpNb(a,b){ const d=(a-b+4)%4; return d===1||d===3; }
let HP = null;
function startHoppang(){
  showScreen("hoppang-screen");
  HP = { seats: buildSeats("table-hp"), round: 0, over: false,
    phase: "idle", combo: null, step: 0, holder: 0, target: -1,
    limit: 2400, deadline: 0, raf: 0, timer: 0 };
  $("msg-hp").textContent = "";
  $("restart-hp-btn").classList.add("hidden");
  $("hp-center").innerHTML = "호! 빵~ 찐~빵 대빵! 🥟";
  HP.timer = setTimeout(nextHpRound, 1000);
  HP.raf = requestAnimationFrame(loopHoppang);
}
function stopHoppang(){ if(HP){ cancelAnimationFrame(HP.raf); clearTimeout(HP.timer); HP = null; } }
function nextHpRound(){
  if(!HP || HP.over) return;
  HP.round++;
  HP.combo = rndOf(HP_COMBOS);
  HP.step = 0;
  HP.phase = "chain";
  HP.holder = rndOf([1,2,3]);
  hpChainStep();
}
function hpChainStep(){
  if(!HP || HP.over) return;
  const [comboName, len] = HP.combo;
  const syl = HP_SYL[HP.step];
  const from = HP.holder;
  let target = rndOf([0,1,2,3].filter(i => i !== from));
  if(from !== 0 && Math.random() < 0.42) target = 0;
  HP.target = target;
  HP.seats.forEach((p,i) => p.el.classList.toggle("turn", i === from));
  $("hp-center").innerHTML = `<b>${HP.seats[from].name}</b> 👉 <b>${HP.seats[target].name}</b> "<b>${syl}!</b>"`;
  click('word'); hop(HP.seats[from]);
  const isLast = (HP.step === len - 1);
  if(target === 0 && !isLast){
    /* 내가 받았다 → 다음 글자를 눌러야 함 */
    HP.phase = "mySyl";
    HP.expectSyl = HP_SYL[HP.step + 1];
    HP.limit = Math.max(900, 2400 - 55 * (HP.round * 3 + HP.step));
    HP.deadline = performance.now() + HP.limit;
    $("msg-hp").textContent = `받았다! 다음 글자를 눌러!`;
  } else if(isLast){
    /* 마지막 "빵!" → 반응 단계 */
    HP.timer = setTimeout(() => hpReaction(target), 500);
  } else {
    /* NPC가 받아서 자동 진행 */
    HP.holder = target;
    HP.step++;
    HP.timer = setTimeout(hpChainStep, Math.max(350, 800 - 40*HP.round));
  }
}
function hpReaction(target){
  if(!HP || HP.over) return;
  const [comboName] = HP.combo;
  let group;   // 으악 해야 하는 사람들
  if(comboName === "호빵") group = [target];
  else if(comboName === "찐빵") group = [0,1,2,3].filter(i => i !== target && hpNb(i, target));
  else group = [0,1,2,3].filter(i => i !== target);
  const meIn = group.includes(0);
  HP.phase = "react";
  HP.reactNeed = meIn;
  $("hp-center").innerHTML = `조합은... <b>${comboName}</b>!! (빵 맞은 사람: <b>${HP.seats[target].name}</b>)`;
  $("msg-hp").textContent = meIn ? "너도 반응조다! [😱 으악!]" : "너는 아니다... 가만히!";
  group.forEach((i,k) => { if(i !== 0) setTimeout(() => { if(HP && !HP.over) { bubbleSay(HP.seats[i], "으악!!", 900); hop(HP.seats[i]); } }, 250 + k*100); });
  HP.limit = Math.max(900, 2200 - 90 * HP.round);
  HP.deadline = meIn ? performance.now() + HP.limit : 0;
  HP.trapUntil = meIn ? 0 : performance.now() + 1300;
  if(!meIn){
    HP.timer = setTimeout(() => { if(HP && !HP.over) hpRoundClear(); }, 1400);
  }
}
function hpRoundClear(){
  HP.phase = "idle"; HP.deadline = 0; HP.trapUntil = 0;
  $("msg-hp").textContent = "세이프! 다음 라운드~";
  HP.timer = setTimeout(nextHpRound, 700);
}
document.querySelectorAll("#hp-controls button").forEach(b => {
  b.addEventListener("click", () => {
    if(!HP || HP.over) return;
    const syl = b.dataset.syl;
    if(HP.phase === "mySyl"){
      if(syl === "으악") return failHoppang("지금은 으악이 아니라 글자를 넘길 차례다!");
      if(syl !== HP.expectSyl) return failHoppang(`"${HP.expectSyl}!"을 눌렀어야지!`);
      bubbleSay(HP.seats[0], syl + "!", 800);
      click('word'); hop(HP.seats[0]);
      HP.deadline = 0;
      HP.holder = 0; HP.step++;
      HP.phase = "chain";
      HP.timer = setTimeout(hpChainStep, 250);
    } else if(HP.phase === "react"){
      if(HP.reactNeed){
        if(syl !== "으악") return failHoppang("반응조는 [😱 으악!]을 눌러야지!");
        bubbleSay(HP.seats[0], "으악!!", 900);
        click('word'); hop(HP.seats[0]);
        HP.deadline = 0; HP.reactNeed = false;
        hpRoundClear();
      } else {
        if(performance.now() < HP.trapUntil)
          return failHoppang("너는 반응조가 아닌데?! 조용히 있으라고!");
      }
    }
    /* idle/chain 중 누른 건 관용 (무시) */
  });
});
function loopHoppang(now){
  if(!HP || HP.over) return;
  const bar = $("bar-hp");
  if(HP.deadline){
    const remain = Math.max(0, HP.deadline - now);
    const ratio = remain / HP.limit;
    bar.style.width = (ratio*100) + "%";
    bar.classList.toggle("low", ratio < 0.35);
    if(remain <= 0) return failHoppang(HP.phase === "react" ? "으악이 늦었다!" : "글자를 못 넘겼다!");
  } else { bar.style.width = "100%"; bar.classList.remove("low"); }
  HP.raf = requestAnimationFrame(loopHoppang);
}
function failHoppang(why){
  if(!HP || HP.over) return;
  HP.over = true;
  cancelAnimationFrame(HP.raf); clearTimeout(HP.timer);
  click('fail');
  shakeSeat(HP.seats[0]);
  saveRec("hoppang", HP.round - 1, gamesByKey.hoppang.recLabel);
  $("msg-hp").innerHTML = `${why} <b class="drink">${HP.seats[0].name}</b> 마셔~ 마셔~ 🍺
    <span class="record-line">이번 판: ${HP.round - 1}라운드 · 최고 기록 ${REC.hoppang.label}</span>`;
  $("restart-hp-btn").classList.remove("hidden");
}
$("restart-hp-btn").addEventListener("click", () => { stopHoppang(); startHoppang(); });

/* ================= 슛돌이 (눈치 기립) ================= */
const ST_SONG = ["혼자 왔어요~","둘이 왔어요~","셋이 왔어요~","넷이 왔어요~"];
let ST = null;
function startShoot(){
  showScreen("shoot-screen");
  ST = { seats: buildSeats("table-st"), phase: 0, verse: 0, over: false,
    npcStand: [], meStand: false, need: 1,
    limit: 4000, deadline: 0, raf: 0, timer: 0, timers: [] };
  $("msg-st").textContent = "";
  $("restart-st-btn").classList.add("hidden");
  $("st-center").innerHTML = "🎵 날아라~ 슛돌이~ ⚽";
  ST.timer = setTimeout(nextVerse, 1100);
  ST.raf = requestAnimationFrame(loopShoot);
}
function stopShoot(){
  if(ST){ cancelAnimationFrame(ST.raf); clearTimeout(ST.timer); ST.timers.forEach(clearTimeout); ST = null; }
}
function nextVerse(){
  if(!ST || ST.over) return;
  ST.verse++;
  ST.need = ((ST.verse - 1) % 4) + 1;   // 1→2→3→4 반복
  ST.meStand = false;
  ST.seats.forEach(s => s.el.classList.remove("stand","turn"));
  $("st-center").innerHTML = `🎵 "<b>${ST_SONG[ST.need - 1]}</b>" (${ST.need}명 일어나야 해!)`;
  $("msg-st").textContent = "눈치를 봐라... 몇 명이 일어나나?";
  ST.limit = Math.max(1800, 4000 - 110 * (ST.verse - 1));   // 점점 짧아진다!
  ST.deadline = performance.now() + ST.limit;
  /* NPC 기립 계획: (need-1)명 또는 need명이 일어남 → 내 판단이 승부처 */
  const w = (ST.need === 4) ? 3 : (Math.random() < 0.5 ? ST.need - 1 : Math.min(3, ST.need));
  const ups = [];
  const pool = [1,2,3].sort(() => Math.random() - 0.5);
  for(let k=0;k<w;k++) ups.push(pool[k]);
  ST.npcStand = ups;
  ST.timers = ups.map((i,k) => setTimeout(() => {
    if(!ST || ST.over) return;
    ST.seats[i].el.classList.add("stand");
    bubbleSay(ST.seats[i], "🙋", 800);
    click('thumb');
  }, 350 + Math.random()*ST.limit*0.45 + k*180));
  /* 마감 판정 */
  ST.timer = setTimeout(judgeShoot, ST.limit);
}
function judgeShoot(){
  if(!ST || ST.over) return;
  const total = ST.npcStand.length + (ST.meStand ? 1 : 0);
  if(total === ST.need){
    $("msg-st").textContent = `딱 ${ST.need}명! 세이프~ 🎉`;
    click('word');
    ST.deadline = 0;
    ST.timer = setTimeout(nextVerse, 900);
  } else if(ST.meStand){
    failShoot(`${total}명이 일어났다... ${ST.need}명이어야 하는데! 네가 오버했다!`);
  } else {
    failShoot(`${total}명뿐... 네가 일어났어야지!`);
  }
}
$("st-stand").addEventListener("pointerdown", e => {
  e.preventDefault();
  if(!ST || ST.over || ST.meStand || !ST.deadline) return;
  ST.meStand = true;
  ST.seats[0].el.classList.add("stand");
  bubbleSay(ST.seats[0], "🙋 왔어요!", 800);
  click('clap');
});
function loopShoot(now){
  if(!ST || ST.over) return;
  const bar = $("bar-st");
  if(ST.deadline){
    const remain = Math.max(0, ST.deadline - now);
    const ratio = remain / ST.limit;
    bar.style.width = (ratio*100) + "%";
    bar.classList.toggle("low", ratio < 0.35);
  } else { bar.style.width = "100%"; bar.classList.remove("low"); }
  ST.raf = requestAnimationFrame(loopShoot);
}
function failShoot(why){
  if(!ST || ST.over) return;
  ST.over = true;
  cancelAnimationFrame(ST.raf); clearTimeout(ST.timer); ST.timers.forEach(clearTimeout);
  click('fail');
  shakeSeat(ST.seats[0]);
  saveRec("shoot", ST.verse - 1, gamesByKey.shoot.recLabel);
  $("msg-st").innerHTML = `${why} <b class="drink">${ST.seats[0].name}</b> 마셔~ 마셔~ 🍺
    <span class="record-line">이번 판: ${ST.verse - 1}소절 · 최고 기록 ${REC.shoot.label}</span>`;
  $("restart-st-btn").classList.remove("hidden");
}
$("restart-st-btn").addEventListener("click", () => { stopShoot(); startShoot(); });

/* ================= 범용 엔진 (11~30번 게임 공용, GX) ================= */
function seatNeighbors(i){ return [(i+3)%4, (i+1)%4]; }
function gxPickTarget(exclude){
  const pool = [0,1,2,3].filter(i => i !== exclude);
  if(exclude !== 0 && Math.random() < 0.45) return 0;
  return rndOf(pool);
}
let GX = null;
function startGeneric(key){
  showScreen("generic-screen");
  const cfg = GXGAMES[key];
  GX = { key, cfg, seats: buildSeats("table-gx"), over:false, round:0,
    raf:0, timer:0, deadline:0, limit:0, onTimeout:null, data:{} };
  $("gx-title").textContent = cfg.title;
  $("gx-center").innerHTML = "";
  $("msg-gx").textContent = "";
  $("gx-controls").innerHTML = "";
  $("gx-input-row").classList.add("hidden");
  $("restart-gx-btn").classList.add("hidden");
  GX.raf = requestAnimationFrame(gxLoop);
  GX.timer = setTimeout(() => cfg.start(GX), 900);
}
function stopGeneric(){ if(GX){ cancelAnimationFrame(GX.raf); clearTimeout(GX.timer); GX = null; } }
function gxLoop(now){
  if(!GX || GX.over) return;
  const bar = $("bar-gx");
  if(GX.deadline){
    const remain = Math.max(0, GX.deadline - now);
    const ratio = remain / GX.limit;
    bar.style.width = (ratio*100)+"%";
    bar.classList.toggle("low", ratio < .35);
    if(remain <= 0){
      GX.deadline = 0;
      const fn = GX.onTimeout; GX.onTimeout = null;
      if(fn) fn();
      if(!GX || GX.over) return;
    }
  } else { bar.style.width="100%"; bar.classList.remove("low"); }
  GX.raf = requestAnimationFrame(gxLoop);
}
function gxSetTimer(ms, onTimeout){ GX.limit = ms; GX.deadline = performance.now() + ms; GX.onTimeout = onTimeout; }
function gxClearTimer(){ GX.deadline = 0; GX.onTimeout = null; }
function gxSafeNext(fn, delay=700){ GX.timer = setTimeout(() => { if(GX && !GX.over) fn(); }, delay); }
function gxBtn(label, onClick, cls=""){
  const b = document.createElement("button");
  b.textContent = label; if(cls) b.className = cls;
  b.addEventListener("click", onClick);
  $("gx-controls").appendChild(b);
  return b;
}
function gxFail(why, recVal){
  if(!GX || GX.over) return;
  GX.over = true;
  cancelAnimationFrame(GX.raf); clearTimeout(GX.timer);
  click('fail'); shakeSeat(GX.seats[0]);
  $("gx-controls").innerHTML = "";
  $("gx-input-row").classList.add("hidden");
  const label = gamesByKey[GX.key].recLabel(recVal);
  saveRec(GX.key, recVal, gamesByKey[GX.key].recLabel);
  $("msg-gx").innerHTML = `${why} <b class="drink">${GX.seats[0].name}</b> 마셔~ 마셔~ 🍺
    <span class="record-line">이번 판: ${label} · 최고 기록 ${REC[GX.key].label}</span>`;
  $("restart-gx-btn").classList.remove("hidden");
}
$("restart-gx-btn").addEventListener("click", () => { const k = GX?GX.key:null; stopGeneric(); if(k) startGeneric(k); });
$("gx-say").addEventListener("click", () => {
  if(!GX || GX.over || GX.key !== "record") return;
  const raw = $("gx-input").value.trim();
  if(!raw) return;
  if(GX.data.used.has(raw)) return gxFail(`"${raw}"는 이미 나왔다!`, GX.round-1);
  GX.data.used.add(raw);
  bubbleSay(GX.seats[0], raw, 1000); click('word'); hop(GX.seats[0]);
  $("gx-input").value=""; $("gx-input-row").classList.add("hidden");
  gxClearTimer();
  GX.data.turn=(GX.data.turn+1)%4;
  gxSafeNext(()=>recordRound(GX), 500);
});
$("gx-input").addEventListener("keydown", e => { if(e.key==="Enter") $("gx-say").click(); });

/* ---- 11. 훈민정음 ---- */
const HUNMIN_BANK = {
  "ㄱㅂ": ["가방","고비","구비"],
  "ㅂㅈ": ["바지","부자","보증"],
  "ㅅㄱ": ["사과","소고기","시금치"],
  "ㅁㅊ": ["미치광이","무침","마차"],
  "ㅇㅅ": ["의사","연습","우산"],
  "ㅎㅅ": ["학생","호수","화살"]
};
function hunminRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const combo = rndOf(Object.keys(HUNMIN_BANK));
  $("gx-center").innerHTML = `술래: "<b>${combo}</b>!" 엄지를 세웠다... 시작하는 단어를 외쳐라!`;
  $("gx-controls").innerHTML = "";
  const validPool = HUNMIN_BANK[combo].filter(w=>!GX.data.used.has(w));
  if(!validPool.length) return gxFail("이 자음으로 만들 단어가 바닥났다!", GX.round-1);
  const trapPool = Object.values(HUNMIN_BANK).flat().filter(w=>!HUNMIN_BANK[combo].includes(w) && !GX.data.used.has(w));
  const chips = [...validPool.slice(0,2), ...trapPool.sort(()=>Math.random()-0.5).slice(0,2)].sort(()=>Math.random()-0.5);
  chips.forEach(w=>{
    gxBtn(w, () => {
      if(GX.data.used.has(w)) return gxFail(`"${w}"...는 이미 나온 단어다!`, GX.round-1);
      if(!HUNMIN_BANK[combo].includes(w)) return gxFail(`"${w}"는 ${combo} 단어가 아니잖아!`, GX.round-1);
      GX.data.used.add(w);
      bubbleSay(GX.seats[0], w+"!", 900); click('word'); hop(GX.seats[0]);
      gxClearTimer(); $("gx-controls").innerHTML="";
      $("msg-gx").textContent = "손 잡았다! 다음 라운드~";
      gxSafeNext(()=>hunminRound(GX), 600);
    }, "chip");
  });
  gxSetTimer(Math.max(1200, 3200 - 90*GX.round), () => gxFail("너무 늦었다! 손 잡혔다!", GX.round-1));
}

/* ---- 12. 아파트 ---- */
function apartRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const floor = 8 + Math.floor(Math.random()*13);
  $("gx-center").innerHTML = `술래: "<b>${floor}층!</b>" 손을 겹쳐 쌓았다...`;
  $("gx-controls").innerHTML = "";
  $("msg-gx").textContent = "손을 하나씩 뺀다...";
  gxBtn("✋ 손 빼기 시작!", () => {
    $("gx-controls").innerHTML = "";
    let count = 0;
    const startIdx = Math.floor(Math.random()*4);
    const tick = () => {
      if(!GX||GX.over) return;
      count++;
      const idx = (startIdx + count - 1) % 4;
      GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===idx));
      if(count >= floor){
        const loser = GX.seats[idx];
        if(loser.isHuman) return gxFail(`${floor}층에 걸렸다!`, GX.round-1);
        $("msg-gx").innerHTML = `<b>${loser.name}</b> 손이 걸렸다! 원샷~ 🍺`;
        click('fail'); shakeSeat(loser);
        gxSafeNext(()=>apartRound(GX), 1000);
        return;
      }
      GX.timer = setTimeout(tick, Math.max(70, 260 - count*4));
    };
    tick();
  });
}

/* ---- 13. 공공칠빵 (+침묵) ---- */
const GONGCHIL_SYL = ["공","공","칠","빵"];
function gongchilRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  GX.data.step = 0;
  GX.data.holder = rndOf([0,1,2,3]);
  gongchilStep(GX);
}
function gongchilStep(GX){
  if(!GX||GX.over) return;
  const syl = GONGCHIL_SYL[GX.data.step];
  const from = GX.data.holder;
  const target = gxPickTarget(from);
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===from));
  $("gx-center").innerHTML = `<b>${GX.seats[from].name}</b> 👉 <b>${GX.seats[target].name}</b> "<b>${syl}!</b>"`;
  bubbleSay(GX.seats[from], syl+"!", 700); click('word'); hop(GX.seats[from]);
  const isLast = GX.data.step === GONGCHIL_SYL.length - 1;
  GX.data.holder = target;
  if(isLast){
    gxSafeNext(() => gongchilReact(GX, target), 500);
  } else if(target === 0){
    $("gx-controls").innerHTML = "";
    gxBtn(`다음! "${GONGCHIL_SYL[GX.data.step+1]}!"`, () => {
      GX.data.step++; gxClearTimer(); $("gx-controls").innerHTML="";
      gxSafeNext(()=>gongchilStep(GX), 200);
    });
    gxSetTimer(Math.max(900, 2200 - 60*GX.round), () => gxFail("글자를 못 넘겼다!", GX.round-1));
  } else {
    GX.data.step++;
    gxSafeNext(() => gongchilStep(GX), Math.max(350, 800-40*GX.round));
  }
}
function gongchilReact(GX, target){
  const group = seatNeighbors(target);
  const meIn = group.includes(0);
  $("gx-center").innerHTML = `<b>빵!</b> (맞은 사람: <b>${GX.seats[target].name}</b>) 양옆이 반응할 차례!`;
  group.forEach((i,k)=>{ if(i!==0) setTimeout(()=>{ if(GX&&!GX.over){ bubbleSay(GX.seats[i],"으악!!",900); hop(GX.seats[i]); } }, 200+k*120); });
  $("gx-controls").innerHTML = "";
  if(meIn){
    $("msg-gx").textContent = "너도 반응조다! [😱 으악!]";
    gxBtn("😱 으악!", () => { bubbleSay(GX.seats[0],"으악!!",900); click('word'); hop(GX.seats[0]); gxClearTimer(); $("gx-controls").innerHTML=""; gxSafeNext(()=>gongchilRound(GX), 700); }, "btn-berry");
    gxSetTimer(Math.max(900, 2000-70*GX.round), () => gxFail("으악이 늦었다!", GX.round-1));
  } else {
    $("msg-gx").textContent = "너는 반응조가 아니다... 가만히!";
    const trapUntil = performance.now() + 1300;
    gxBtn("😱 으악!", () => { if(performance.now() < trapUntil) gxFail("너는 반응조가 아닌데?!", GX.round-1); }, "btn-berry");
    gxSafeNext(() => { $("gx-controls").innerHTML=""; gongchilRound(GX); }, 1400);
  }
}

/* ---- 14. 바니바니 ---- */
function bannyRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const from = GX.data.passer;
  if(from === 0){
    $("gx-center").innerHTML = `네 차례! "바니바니 바니바니~" 누구에게 넘길까?`;
    $("gx-controls").innerHTML = "";

/* ---- 17/30. 잔치기 (+ 스피드 변형) ---- */
function janchigiStep(GX, n){
  const len=4;
  if(n===2) GX.data.dir *= -1;
  const step = (n===3) ? 2 : 1;
  GX.data.idx = ((GX.data.idx + GX.data.dir*step) % len + len) % len;
}
function janchigiRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const cur = GX.data.idx;
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===cur));
  const baseLimit = GX.cfg.speed ? 1600 : 3200;
  const decay = GX.cfg.speed ? 40 : 90;
  if(cur===0){
    $("gx-center").innerHTML = `네 차례! 잔을 몇 번 칠까?`;
    $("gx-controls").innerHTML="";
    gxBtn("탁 (진행)", () => { janchigiStep(GX,1); resolveJanchigi(GX); });
    gxBtn("탁탁 (역방향)", () => { janchigiStep(GX,2); resolveJanchigi(GX); });
    gxBtn("탁탁탁 (점프)", () => { janchigiStep(GX,3); resolveJanchigi(GX); });
    gxSetTimer(Math.max(900, baseLimit-decay*GX.round), () => gxFail("타이밍을 놓쳤다!", GX.round-1));
  } else {
    const n = rndOf([1,1,2,3]);
    $("gx-center").innerHTML = `<b>${GX.seats[cur].name}</b>: ${"탁".repeat(n)}!`;
    click('knee'); hop(GX.seats[cur]);
    gxSafeNext(() => { janchigiStep(GX,n); resolveJanchigi(GX); }, Math.max(300, 700-GX.round*15));
  }
}
function resolveJanchigi(GX){ gxClearTimer(); $("gx-controls").innerHTML=""; gxSafeNext(()=>janchigiRound(GX), 300); }

/* ---- 20/21. 369게임 · 울트라 369게임 ---- */
function digitsRestricted(n){ return String(n).split("").filter(d=>"369".includes(d)).length; }
const KOREAN_NUM = [
  {n:1,syl:["하","나"]},{n:2,syl:["둘"]},{n:3,syl:["셋"]},{n:4,syl:["넷"]},
  {n:5,syl:["다","섯"]},{n:6,syl:["여","섯"]},{n:7,syl:["일","곱"]},
  {n:8,syl:["여","덟"]},{n:9,syl:["아","홉"]},{n:10,syl:["열"]}
];
const ULTRA69_FLAT = [];
KOREAN_NUM.forEach(({n,syl}) => syl.forEach(s => ULTRA69_FLAT.push({text:s, clap: digitsRestricted(n)>0})));

function sam69Round(GX){
  if(!GX||GX.over) return;
  GX.data.n++;
  const n = GX.data.n;
  const need = digitsRestricted(n);
  const cur = GX.data.turn;
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===cur));
  if(cur===0){
    $("gx-center").innerHTML = need ? `숫자 <b>${n}</b>! 짝을 <b>${need}번</b> 쳐라! (말하면 안 됨)` : `숫자 <b>${n}</b>! 그대로 말해라!`;
    $("gx-controls").innerHTML="";
    GX.data.claps = 0;
    if(need===0){
      gxBtn(`${n} 말하기!`, () => { click('word'); hop(GX.seats[0]); gxClearTimer(); $("gx-controls").innerHTML=""; GX.data.turn=(cur+1)%4; gxSafeNext(()=>sam69Round(GX),400); });
    } else {
      const b = gxBtn(`짝! (0/${need})`, () => {
        GX.data.claps++; click('clap'); hop(GX.seats[0]);
        b.textContent = `짝! (${GX.data.claps}/${need})`;
        if(GX.data.claps>=need){ gxClearTimer(); $("gx-controls").innerHTML=""; GX.data.turn=(cur+1)%4; gxSafeNext(()=>sam69Round(GX),400); }
      });
    }
    gxSetTimer(Math.max(1000, 3000-40*n), () => gxFail(`${n}에서 막혔다!`, n-1));
  } else {
    $("gx-center").innerHTML = need ? `<b>${GX.seats[cur].name}</b>: ${"짝".repeat(need)}!` : `<b>${GX.seats[cur].name}</b>: ${n}!`;
    click(need? 'clap':'word'); hop(GX.seats[cur]);
    GX.data.turn=(cur+1)%4;
    gxSafeNext(()=>sam69Round(GX), Math.max(300, 600-n*6));
  }
}
function ultra69Round(GX){
  if(!GX||GX.over) return;
  const unit = ULTRA69_FLAT[GX.data.idx % ULTRA69_FLAT.length];
  GX.data.idx++;
  const cur = GX.data.turn;
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===cur));
  if(cur===0){
    $("gx-center").innerHTML = unit.clap ? `이 음절은 <b>짝!</b>` : `음절: "<b>${unit.text}</b>"`;
    $("gx-controls").innerHTML="";

      gxBtn("짝!", () => { click('clap'); hop(GX.seats[0]); gxClearTimer(); $("gx-controls").innerHTML=""; GX.data.turn=(cur+1)%4; gxSafeNext(()=>ultra69Round(GX),350); });
    } else {
      gxBtn(`"${unit.text}!"`, () => { click('word'); hop(GX.seats[0]); gxClearTimer(); $("gx-controls").innerHTML=""; GX.data.turn=(cur+1)%4; gxSafeNext(()=>ultra69Round(GX),350); });
    }
    gxSetTimer(Math.max(800, 2400-30*GX.data.idx), () => gxFail("음절을 놓쳤다!", GX.data.idx-1));
  } else {
    $("gx-center").innerHTML = `<b>${GX.seats[cur].name}</b>: ${unit.clap ? "짝!" : unit.text+"!"}`;
    click(unit.clap?'clap':'word'); hop(GX.seats[cur]);
    GX.data.turn=(cur+1)%4;
    gxSafeNext(()=>ultra69Round(GX), Math.max(280, 550-GX.data.idx*4));

}

const EGAMYEON_THEME = { place:"시장", items:["사과","배","수박","참외","딸기","고구마","감자","양파","당근","오이","호박","무","배추","마늘"] };
function egamyeonRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const cur = (GX.round-1) % 4;
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===cur));
  if(cur===0){
    if(!GX.data.list.length){
      const add = rndOf(EGAMYEON_THEME.items);

      $("gx-center").innerHTML = `<b>${EGAMYEON_THEME.place}에 가면!</b>`;
      $("gx-controls").innerHTML="";

      gxSafeNext(()=>egamyeonRound(GX), 700);
      return;
    }
    $("gx-center").innerHTML = `<b>${EGAMYEON_THEME.place}에 가면!</b> 지금까지 나온 걸 순서대로 눌러!`;
    $("gx-controls").innerHTML="";
    const shuffled = [...GX.data.list].sort(()=>Math.random()-0.5);
    let expectIdx = 0;
    shuffled.forEach(item => {
      const b = gxBtn(item, () => {
        if(item !== GX.data.list[expectIdx]) return gxFail(`순서가 틀렸다! ("${item}")`, GX.data.list.length);
        b.disabled = true; expectIdx++;
        if(expectIdx >= GX.data.list.length){
          const pool = EGAMYEON_THEME.items.filter(w=>!GX.data.list.includes(w));
          const add = rndOf(pool.length?pool:EGAMYEON_THEME.items);
          GX.data.list.push(add);
          bubbleSay(GX.seats[0], add+"!", 900); click('word'); hop(GX.seats[0]);
          gxClearTimer();
          gxSafeNext(()=>egamyeonRound(GX), 700);
        }
      }, "chip");
    });
    gxSetTimer(Math.max(2500, 6000-GX.data.list.length*200), () => gxFail("기억이 안 난다!", GX.data.list.length));
  } else {
    const pool = EGAMYEON_THEME.items.filter(w=>!GX.data.list.includes(w));
    const add = rndOf(pool.length?pool:EGAMYEON_THEME.items);
    GX.data.list.push(add);
    $("gx-center").innerHTML = `<b>${GX.seats[cur].name}</b>: ${GX.data.list.join(", ")}...!`;
    bubbleSay(GX.seats[cur], add+"!", 900); click('word'); hop(GX.seats[cur]);
    gxSafeNext(()=>egamyeonRound(GX), 900);
  }
}

function hongsamRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const leader = GX.data.leader;
  const pool = [0,1,2,3].filter(i=>i!==leader);
  const picks = pool.sort(()=>Math.random()-0.5).slice(0,2);
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===leader));
  $("gx-center").innerHTML = `<b>${GX.seats[leader].name}</b>: "너, 너!" 👉 <b>${picks.map(i=>GX.seats[i].name).join(", ")}</b>`;
  bubbleSay(GX.seats[leader], "너, 너!", 1000); click('word'); hop(GX.seats[leader]);
  $("gx-controls").innerHTML="";
  const humanPicks = picks.includes(0);
  gxSafeNext(() => {
    if(humanPicks){
      $("msg-gx").textContent = "너도 지목받았다! 누굴 가리킬래?";
      [1,2,3].forEach(i => gxBtn(`👉 ${GX.seats[i].name}`, () => hongsamResolve(GX, picks)));
      gxSetTimer(Math.max(1000,2600-60*GX.round), () => gxFail("못 골랐다!", GX.round-1));
    } else {
      hongsamResolve(GX, picks);
    }
  }, 700);
}
function hongsamResolve(GX, picks){
  gxClearTimer(); $("gx-controls").innerHTML="";
  const choices = {};
  picks.forEach(i => { choices[i] = gxPickTarget(i); });
  const targets = picks.map(i=>choices[i]);
  const converge = targets[0] === targets[1] ? targets[0] : null;
  $("gx-center").innerHTML = picks.map(i=>`${GX.seats[i].name}→${GX.seats[choices[i]].name}`).join(" / ");
  if(converge !== null){
    $("msg-gx").innerHTML = `<b>${GX.seats[converge].name}</b> 아~ 싸 홍삼! 🎉 다음 리더!`;
    GX.data.leader = converge;
  } else {
    $("msg-gx").textContent = "안 겹쳤다... 다시!";
  }
  gxSafeNext(()=>hongsamRound(GX), 1100);
}

function dmRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const holder = GX.data.holder;
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===holder));
  if(holder===0){
    $("gx-center").innerHTML = "네 차례! 동작 두 개를 연달아 선택!";
    $("gx-controls").innerHTML="";
    GX.data.picked=[];
    DM_GESTURES.forEach(g => gxBtn(g, () => {
      GX.data.picked.push(g); click('thumb'); hop(GX.seats[0]);
      if(GX.data.picked.length>=2){
        gxClearTimer(); $("gx-controls").innerHTML="";
        bubbleSay(GX.seats[0], GX.data.picked.join(""), 900);
        dmPickTarget(GX);
      }
    }));
    gxSetTimer(Math.max(900,2400-70*GX.round), () => gxFail("동작이 느렸다!", GX.round-1));
  } else {
    gxSafeNext(() => {
      bubbleSay(GX.seats[holder], rndOf(DM_GESTURES)+rndOf(DM_GESTURES), 900); hop(GX.seats[holder]); click('thumb');
      GX.data.holder = gxPickTarget(holder);
      gxSafeNext(()=>dmRound(GX), 500);
    }, 700);
  }
}
function dmPickTarget(GX){
  $("gx-center").innerHTML = "누구에게 넘길까?";
  [1,2,3].forEach(i => gxBtn(`👉 ${GX.seats[i].name}`, () => { GX.data.holder=i; gxSafeNext(()=>dmRound(GX), 400); }));
}

/* ---- 26. 더 게임 오브 데쓰 ---- */
function deathRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const pointers = [0,1,2,3].map(i => { const pool=[0,1,2,3].filter(x=>x!==i); return rndOf(pool); });
  const host = rndOf([0,1,2,3]);
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===host));
  $("gx-controls").innerHTML="";
  if(host===0){
    $("gx-center").innerHTML = "네가 술래다! 숫자를 외쳐라!";
    [3,5,7,9].forEach(n => gxBtn(`${n}!`, () => deathResolve(GX, pointers, host, n)));
    gxSetTimer(3200, () => gxFail("숫자를 못 골랐다!", GX.round-1));
  } else {
    const n = rndOf([3,5,7,9]);
    gxSafeNext(() => deathResolve(GX, pointers, host, n), 700);
  }
}
function deathResolve(GX, pointers, host, n){
  gxClearTimer(); $("gx-controls").innerHTML="";
  let cur = host;
  const path = [cur];
  for(let k=0;k<n;k++){ cur = pointers[cur]; path.push(cur); }
  $("gx-center").innerHTML = `<b>${GX.seats[host].name}</b>: "${n}!" 손가락을 따라간다...`;
  let step=0;
  const tick = () => {
    if(!GX||GX.over) return;
    GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===path[step]));
    if(step >= path.length-1){
      const loser = GX.seats[path[path.length-1]];
      if(loser.isHuman) return gxFail(`숫자 ${n}에 걸렸다!`, GX.round-1);
      $("msg-gx").innerHTML = `<b>${loser.name}</b> 걸렸다! 원샷~ 🍺`;
      click('fail'); shakeSeat(loser);
      gxSafeNext(()=>deathRound(GX), 1000);
      return;
    }
    step++;
    GX.timer = setTimeout(tick, 260);
  };
  tick();
}

/* ---- 27. 파도게임 (단체 잔 비우기) ---- */
function pado2Round(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const leader = rndOf([0,1,2,3]);
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===leader));
  $("gx-controls").innerHTML="";
  if(leader===0){
    $("gx-center").innerHTML = "네가 리더다! 파도를 지시하라!";
    gxBtn("🌊 왼쪽으로 반 잔!", () => resolvePado2(GX, "왼쪽으로 반 잔", 0));
    gxBtn("🌊 오른쪽으로 한 잔!", () => resolvePado2(GX, "오른쪽으로 한 잔", 0));
    gxSetTimer(Math.max(1000,2800-80*GX.round), () => gxFail("지시를 못 내렸다!", GX.round-1));
  } else {
    const o = rndOf(["왼쪽으로 반 잔","오른쪽으로 한 잔","전체 원샷 파도"]);
    gxSafeNext(() => resolvePado2(GX, o, leader), 900);
  }
}
function resolvePado2(GX, order, leader){
  gxClearTimer(); $("gx-controls").innerHTML="";
  $("gx-center").innerHTML = `<b>${GX.seats[leader].name}</b>: "${order} 파도!" 🌊`;
  bubbleSay(GX.seats[leader], "파도!", 900); click('word'); hop(GX.seats[leader]);
  $("msg-gx").textContent = "다같이 파도 이행 중...";
  gxSafeNext(()=>pado2Round(GX), 1000);
}

/* ---- 29. 레코드 게임 ---- */
const RECORD_TITLES = ["다이너마이트","봄날","작은 것들을 위한 시","벚꽃 엔딩","좋은 날","여행","밤편지","아로하","고백","안녕"];
function recordRound(GX){
  if(!GX||GX.over) return;
  GX.round++;
  const cur = GX.data.turn;
  GX.seats.forEach((p,i)=>p.el.classList.toggle("turn", i===cur));
  if(cur===0){
    $("gx-center").innerHTML = "노래 제목을 하나 대라! (중복 불가, 가사 말고 제목만!)";
    $("gx-input-row").classList.remove("hidden");
    $("gx-input").value = "";
    $("gx-input").focus();
    gxSetTimer(Math.max(2500, 6000-GX.round*150), () => { $("gx-input-row").classList.add("hidden"); gxFail("시간 초과!", GX.round-1); });
  } else {
    $("gx-input-row").classList.add("hidden");
    const pool = RECORD_TITLES.filter(t=>!GX.data.used.has(t));
    const t = rndOf(pool.length?pool:RECORD_TITLES);
    GX.data.used.add(t);
    $("gx-center").innerHTML = `<b>${GX.seats[cur].name}</b>: "${t}!"`;
    bubbleSay(GX.seats[cur], t, 1000); click('word'); hop(GX.seats[cur]);
    GX.data.turn=(cur+1)%4;
    gxSafeNext(()=>recordRound(GX), 800);
  }
}
