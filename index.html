<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤게임!</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ① 입장 -->
<div id="start-screen" class="screen">
  <div id="title-main">술게임<br><span class="soju">랜덤게임!</span></div>
  <div class="sub">이름을 알려줘! (구호에 들어가)</div>
  <input id="name-input" maxlength="6" placeholder="예: 정현" autocomplete="off">
  <button id="start-btn" class="btn-green">입장하기</button>
</div>

<!-- ② 구호 -->
<div id="chant-screen" class="screen hidden">
  <div id="chant-text"></div>
  <div class="crowd" id="chant-crowd"></div>
</div>

<!-- ③ 메인 메뉴 -->
<div id="menu-screen" class="screen hidden">
  <h1>🍺 랜덤게임!</h1>
  <div id="slot-box">&nbsp;</div>
  <div class="menu-list">
    <button id="menu-random" class="btn-berry">🎲 랜덤게임 시작</button>
    <button id="menu-explain">📖 게임 설명</button>
    <button id="menu-rank">🏆 랭킹</button>
  </div>
  <button id="menu-pick" class="btn-small">🎯 게임 골라서 하기</button>
</div>

<!-- ④ 게임 설명 (목록) -->
<div id="explain-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <h1 style="font-size:34px;">📖 게임 설명</h1>
  <div class="sub" id="explain-sub">게임을 누르면 자세한 룰이 나와!</div>
  <div class="explain-list" id="explain-list"></div>
</div>

<!-- ⑤ 랭킹 -->
<div id="rank-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <h1 style="font-size:34px;">🏆 랭킹</h1>
  <div class="sub">이 브라우저에 저장돼! 최고 기록에 도전해봐</div>
  <table id="rank-table"></table>
</div>

<!-- ⑥ 베스킨라빈스 31 -->
<div id="game31-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🍦 베스킨라빈스 31</div>
  <div id="count-display">-</div>
  <div id="table31" class="seat-table"></div>
  <div id="msg31" class="msg"></div>
  <div id="controls31">
    <button data-n="1">1개 외치기</button>
    <button data-n="2">2개 외치기</button>
    <button data-n="3">3개 외치기</button>
  </div>
  <button id="restart31-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑦ 리듬 (딸기/과일/리버스/고래 공용) -->
<div id="rhythm-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div id="r-title"></div>
  <div id="r-round">&nbsp;</div>
  <div id="lyric">&nbsp;</div>
  <div id="beat-row"></div>
  <div style="height:14px;"></div>
  <div id="table-r" class="seat-table"></div>
  <div id="r-msg" class="msg"></div>
  <button id="tap-btn" disabled>외쳐!</button>
  <div class="btn-row">
    <button id="r-restart" class="hidden btn-green">다시 하기</button>
  </div>
</div>

<!-- ⑧ 지하철 -->
<div id="subway-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🚇 지하철 게임</div>
  <div id="sub-line-pick" class="btn-row">
    <div class="sub" style="width:100%;">지하철~ 지하철! 몇호선~ 몇호선! 노선을 골라!</div>
    <button class="btn-green" data-line="line2">서울 2호선</button>
    <button class="btn-sky" data-line="incheon1">인천 1호선</button>
  </div>
  <div id="sub-play" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;">
    <div id="sub-line-name" class="sub"></div>
    <div class="timer-wrap"><div id="bar-sub" class="timer-bar"></div></div>
    <div id="table-sub" class="seat-table"></div>
    <div id="msg-sub" class="msg"></div>
    <div>
      <input id="sub-input" placeholder="역 이름!" autocomplete="off">
      <button id="sub-say" class="btn-sky">외치기!</button>
    </div>
    <div id="sub-used"></div>
    <button id="restart-sub-btn" class="hidden btn-green">다시 하기</button>
  </div>
</div>

<!-- ⑨ 어목조동 -->
<div id="eomok-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🐟 어목조동</div>
  <div id="em-center" class="big-center">어! 목! 조! 동!</div>
  <div class="timer-wrap"><div id="bar-em" class="timer-bar"></div></div>
  <div id="table-em" class="seat-table"></div>
  <div id="msg-em" class="msg"></div>
  <div id="em-chips" class="btn-row"></div>
  <div id="em-used" class="sub" style="max-width:min(520px,92vw);"></div>
  <button id="restart-em-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑩ 공산당 (왕게임) -->
<div id="gongsan-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">✊ 공산당</div>
  <div id="gs-center" class="big-center">공~산당 공산당!</div>
  <div class="timer-wrap"><div id="bar-gs" class="timer-bar"></div></div>
  <div id="table-gs" class="seat-table"></div>
  <div id="msg-gs" class="msg"></div>
  <div id="gs-targets" class="btn-row"></div>
  <button id="restart-gs-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑪ 호빵찐빵 (007빵식) -->
<div id="hoppang-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">🥟 호빵찐빵</div>
  <div id="hp-center" class="big-center">호! 빵~ 찐~빵 대빵!</div>
  <div class="timer-wrap"><div id="bar-hp" class="timer-bar"></div></div>
  <div id="table-hp" class="seat-table"></div>
  <div id="msg-hp" class="msg"></div>
  <div id="hp-controls" class="btn-row">
    <button data-syl="호">호!</button>
    <button data-syl="빵">빵!</button>
    <button data-syl="찐">찐!</button>
    <button data-syl="대">대!</button>
    <button data-syl="으악" class="btn-berry">😱 으악!</button>
  </div>
  <button id="restart-hp-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑫ 슛돌이 (눈치 기립) -->
<div id="shoot-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div style="font-size:28px;font-weight:700;">⚽ 슛돌이</div>
  <div id="st-center" class="big-center">🎵 날아라~ 슛돌이~</div>
  <div class="timer-wrap"><div id="bar-st" class="timer-bar"></div></div>
  <div id="table-st" class="seat-table"></div>
  <div id="msg-st" class="msg"></div>
  <button id="st-stand" class="btn-berry" style="font-size:26px;padding:12px 36px;">🙋 일어나기!</button>
  <button id="restart-st-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- ⑬ 범용 게임 화면 (GX 엔진 공용) -->
<div id="generic-screen" class="screen hidden">
  <button class="btn-small back-corner" data-menu>← 메뉴</button>
  <div id="gx-title" style="font-size:28px;font-weight:700;"></div>
  <div id="gx-center" class="big-center"></div>
  <div class="timer-wrap"><div id="bar-gx" class="timer-bar"></div></div>
  <div id="table-gx" class="seat-table"></div>
  <div id="msg-gx" class="msg"></div>
  <div id="gx-controls" class="btn-row"></div>
  <div id="gx-input-row" class="hidden">
    <input id="gx-input" placeholder="입력!" autocomplete="off">
    <button id="gx-say" class="btn-sky">외치기!</button>
  </div>
  <button id="restart-gx-btn" class="hidden btn-green">다시 하기</button>
</div>

<!-- 룰 모달 -->
<div id="rule-modal" class="hidden">
  <div id="rule-card">
    <button id="rule-x" aria-label="닫기">✕</button>
    <h2 id="rule-title">게임 룰 📋</h2>
    <div id="rule-intro"></div>
    <div id="rule-body">
      <ul id="rule-list"></ul>
    </div>
    <div id="rule-actions"><button id="rule-start" class="btn-green">게임 시작! 🍺</button></div>
  </div>
</div>

<!-- BGM 자리: <audio id="bgm" src="bgm.mp3" loop></audio> -->

<!-- 공통 → 엔진 → 게임 순서로 불러온다. 게임 파일 순서 = 메뉴 순서 -->
<script src="js/core.js"></script>
<script src="js/engines/rhythm.js"></script>
<script src="js/engines/generic.js"></script>
<script src="js/games/g31.js"></script>
<script src="js/games/ddalgi.js"></script>
<script src="js/games/fruit.js"></script>
<script src="js/games/reverse.js"></script>
<script src="js/games/whale.js"></script>
<script src="js/games/eomok.js"></script>
<script src="js/games/gongsan.js"></script>
<script src="js/games/hoppang.js"></script>
<script src="js/games/shoot.js"></script>
<script src="js/games/subway.js"></script>
<script src="js/games/hunmin.js"></script>
<script src="js/games/apart.js"></script>
<script src="js/games/gongchil.js"></script>
<script src="js/games/banny.js"></script>
<script src="js/games/orange.js"></script>
<script src="js/games/chulseok.js"></script>
<script src="js/games/janchigi.js"></script>
<script src="js/games/pado.js"></script>
<script src="js/games/namu.js"></script>
<script src="js/games/sam69.js"></script>
<script src="js/games/mecanderv.js"></script>
<script src="js/games/egamyeon.js"></script>
<script src="js/games/hongsam.js"></script>
<script src="js/games/doublemotion.js"></script>
<script src="js/games/deathgame.js"></script>
<script src="js/games/pado2.js"></script>
<script src="js/games/record.js"></script>
</body>
</html>
